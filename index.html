<body>
<header>
  <a class="brand" href="./"><img src="logo.png?v=1.0.3" alt="" width="30" height="30"><span translate="no">Gomoku</span></a>
  <div class="header-controls">
    <div class="accessibility-controls">
      <button id="contrast" aria-pressed="false" data-label="High contrast"><span aria-hidden="true">◐</span> <span data-t="contrast">Kontrast</span></button>
      <label class="text-size-control"><input type="checkbox" id="large" data-label="Larger text"><span aria-hidden="true">A+</span></label>
    </div>
    <div class="preferences">
      <select id="language" data-label="Language"></select>
      <select id="theme" data-label="Appearance"></select>
    </div>
  </div>
</header>
<main id="game-area">
  <button id="my-progress" type="button" aria-haspopup="dialog" aria-controls="progress-dialog" translate="no">
  <strong id="progress-name">Moje postępy</strong>
  <span class="progress-count"><span aria-hidden="true">🏆</span> <bdi id="progress-wins">0</bdi></span>
  <span class="progress-count" id="progress-next" hidden><span aria-hidden="true">🎁</span> <bdi id="progress-next-count"></bdi></span>
  <span class="progress-chevron" aria-hidden="true">›</span>
</button>
  <div class="game-toolbar">
    <button id="new-game" dir="auto" class="primary" data-label="New game"><span class="toolbar-icon" aria-hidden="true">+</span><span class="toolbar-label" data-t="New game">Nowa gra</span></button>
    <div class="game-tools"><button id="game-picker-button" type="button" aria-haspopup="dialog" aria-controls="game-picker" aria-label="Inne gry" translate="no">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="12" y="2" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/></svg><span class="toolbar-label">Inne gry</span></button>
      <div id="history-controls" class="history-controls" role="group" data-label="historyOption" hidden>
        <button id="undo" dir="auto" data-label="undoMove" type="button" disabled><span class="toolbar-icon" aria-hidden="true">↶</span> <span class="toolbar-label" data-t="undoMove">Cofnij</span></button>
        <button id="redo" dir="auto" data-label="redoMove" type="button" disabled><span class="toolbar-icon" aria-hidden="true">↷</span> <span class="toolbar-label" data-t="redoMove">Przywróć</span></button>
      </div>
      <button id="fullscreen" dir="auto" type="button" aria-pressed="false"><span class="fullscreen-icon" aria-hidden="true">⛶</span><span class="fullscreen-label"></span></button>
      <button id="help-button" dir="auto" data-label="How to play" aria-haspopup="dialog"><span class="toolbar-icon" aria-hidden="true">?</span><span class="toolbar-label" data-t="How to play">Jak grać?</span></button>
      <button id="settings-button" dir="auto" class="shared-settings-button" data-label="Settings" aria-haspopup="dialog"></button>
    </div>
  </div>
  <section class="game">
    <p id="status" role="status"></p>
    <div id="board" class="board-grid" role="grid"></div>
    <div class="board-actions">
      <button id="confirm-move" class="primary" disabled></button>
    </div>
    <p id="selection" aria-live="polite" hidden></p>
    <p id="storage-message" role="status" hidden data-t="storage"></p>
  </section>
</main>
<footer>
  <section class="support-causes" aria-labelledby="support-title">
    <h2 id="support-title" data-t="support">Wesprzyj</h2>

      <a href="https://www.pah.org.pl/gdzie-dzialamy/ukraina/" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">🇺🇦</span> <span data-t="Help Ukraine · PAH"></span></a>

    </div>
  </section>
  <nav class="games-chest-menu" translate="no"><div class="recent-games" hidden><span></span><div class="recent-games-icons"></div></div><a class="all-games" href="https://games-chest.com/">Wszystkie gry</a></nav>

<dialog id="progress-dialog" class="progress-summary" aria-labelledby="progress-title" translate="no">
  <div class="progress-heading">
    <h2 id="progress-title">My progress</h2>
    <form method="dialog"><button id="progress-close" class="progress-summary-close" aria-label="Close" autofocus>×</button></form>
  </div>
  <dl id="progress-metrics"></dl>
  <p id="progress-reward-detail" hidden translate="no"></p>
</dialog>
<dialog id="game-picker" aria-labelledby="game-picker-title" translate="no">
  <div class="game-picker-header">
    <h2 id="game-picker-title">Inne gry</h2>
    <form method="dialog"><button id="game-picker-close" type="submit" aria-label="Zamknij" autofocus>×</button></form>
  </div>
  <div id="game-picker-recent" hidden>
    <h3 id="game-picker-recent-title">Ostatnio otwierane</h3>
    <ul aria-labelledby="game-picker-recent-title"></ul>
  </div>
  <ul id="game-picker-list" aria-labelledby="game-picker-title"></ul>
  <a class="all-games game-picker-link" href="https://games-chest.com/">Wszystkie gry</a>
</dialog>
<dialog id="settings" class="shared-settings" aria-labelledby="settings-title" aria-describedby="settings-summary">
  <form method="dialog" class="settings-shell">
    <header class="settings-header">
      <div class="settings-heading"><h2 id="settings-title" dir="auto" data-t="Settings"></h2><button type="submit" id="settings-dismiss" data-label="Close">×</button></div>
      <p id="settings-summary" class="settings-summary" data-setting="autosave"></p>
    </header>
    <div class="settings-body">
      <div id="settings-save-error" class="settings-save-error" role="alert" hidden><p data-setting="error"></p><button type="button" id="settings-retry" data-setting="retry"></button></div>
      <fieldset class="settings-section"><legend data-setting="rules"></legend>
<div class="setting-item"><div class="setting-row"><label for="size"><span class="setting-caption"><span data-t="size"></span><span class="setting-timing" data-setting="next"></span></span></label><button type="button" class="setting-info" id="size-info" aria-expanded="false" aria-controls="size-description" data-option="size">ⓘ</button></div><select id="size"><option value="15">15×15</option><option value="13">13×13</option></select><p id="size-description" class="setting-description" hidden data-t="sizeInfo"></p></div>
<div class="setting-item"><div class="setting-row"><label for="difficulty"><span class="setting-caption"><span data-t="difficulty"></span><span class="setting-timing" data-setting="next"></span></span></label><button type="button" class="setting-info" id="difficulty-info" aria-expanded="false" aria-controls="difficulty-description" data-option="difficulty">ⓘ</button></div><select id="difficulty"><option value="easy" data-t="easy"></option><option value="medium" data-t="medium"></option><option value="hard" data-t="hard"></option></select><div id="difficulty-description" class="setting-description" hidden><p data-t="difficultyInfo"></p><ul><li data-t="easyInfo"></li><li data-t="mediumInfo"></li><li data-t="hardInfo"></li></ul></div></div>
<div class="setting-item"><div class="setting-row"><label for="starter-rule"><span class="setting-caption"><span data-t="starterRule"></span><span class="setting-timing" data-setting="next"></span></span></label><button type="button" class="setting-info" id="starter-rule-info" aria-expanded="false" aria-controls="starter-rule-description" data-option="starterRule">ⓘ</button></div><select id="starter-rule"><option value="loser" data-t="lastLoser"></option><option value="alternate" data-t="alternateStarter"></option></select><p id="starter-rule-description" class="setting-description" hidden data-t="starterRuleInfo"></p></div>
<div class="setting-item"><div class="setting-row"><label for="player-mark"><span class="setting-caption"><span data-t="playerMark"></span><span class="setting-timing" data-setting="next"></span></span></label><button type="button" class="setting-info" id="player-mark-info" aria-expanded="false" aria-controls="player-mark-description" data-option="playerMark">ⓘ</button></div><select id="player-mark"><option value="X" data-t="markX">X</option><option value="O" data-t="markO">O</option></select><p id="player-mark-description" class="setting-description" hidden data-t="playerMarkInfo"></p></div>
<div class="setting-item"><div class="setting-row"><label><input id="sliding" type="checkbox"><span class="setting-caption"><span data-t="sliding"></span><span class="setting-timing" data-setting="next"></span></span></label><button type="button" class="setting-info" id="sliding-info" aria-expanded="false" aria-controls="sliding-description" data-option="sliding">ⓘ</button></div><p id="sliding-description" class="setting-description" hidden data-t="slidingInfo"></p></div>
      </fieldset>
      <fieldset class="settings-section"><legend data-setting="display"></legend>
<div class="setting-item"><div class="setting-row"><label><input id="mark-colors" type="checkbox"><span class="setting-caption"><span data-t="markColors"></span><span class="setting-timing" data-setting="now"></span></span></label><button type="button" class="setting-info" id="mark-colors-info" aria-expanded="false" aria-controls="mark-colors-description" data-option="markColors">ⓘ</button></div><p id="mark-colors-description" class="setting-description" hidden data-t="markColorsInfo"></p></div>
<div class="setting-item"><div class="setting-row"><label><input id="show-history" type="checkbox"><span class="setting-caption"><span data-t="historyOption"></span><span class="setting-timing" data-setting="now"></span></span></label><button type="button" class="setting-info" id="show-history-info" aria-expanded="false" aria-controls="show-history-description" data-option="historyOption">ⓘ</button></div><p id="show-history-description" class="setting-description" hidden data-t="historyInfo"></p></div>
      </fieldset>
      <section class="settings-section" aria-labelledby="backup-title">
        <h3 id="backup-title"></h3><p id="backup-scope"></p>
        <div class="settings-backup-actions"><button type="button" id="backup-export"></button><button type="button" id="backup-import"></button></div>
        <input id="backup-file" type="file" accept=".json,application/json" hidden>
        <p id="backup-status" role="status"></p>
      </section>
    </div>
  </form>
</dialog>
<dialog id="backup-confirm" aria-labelledby="backup-confirm-title" aria-describedby="backup-confirm-scope">
 <form method="dialog">
  <div class="dialog-heading"><h2 id="backup-confirm-title" dir="auto"></h2><button id="backup-dismiss" type="submit" value="cancel" data-label="Close">×</button></div>
  <p id="backup-confirm-scope"></p><p id="backup-config"></p><p id="backup-summary"></p><p id="backup-note"></p><p id="backup-theme-note"></p>
  <p id="backup-error" role="alert" hidden></p>
  <div class="settings-backup-actions"><button id="backup-cancel" value="cancel"></button><button id="backup-restore" type="button" class="primary"></button></div>
 </form>
</dialog>
<dialog id="help" aria-labelledby="help-title">
  <form method="dialog" class="dialog-heading"><h2 id="help-title" data-t="How to play"></h2><button data-label="Close">×</button></form>
  <p id="game-name">Gomoku — Pięć w rzędzie</p>
  <p data-t="computerRules"></p>
  <p data-t="rules"></p>
  <p data-t="controls"></p>
</dialog>
<dialog id="gallery" aria-labelledby="gallery-title">
  <form method="dialog" class="dialog-heading"><h2 id="gallery-title" data-t="themes"></h2><button data-label="Close">×</button></form>
  <ul class="theme-grid" id="gallery-ordinary" role="list"></ul>
  <section aria-labelledby="gallery-rewards-title">
    <h3 id="gallery-rewards-title" data-t="achievementThemes"></h3>
    <ul class="theme-grid" id="gallery-rewards" role="list"></ul>
  </section>
</dialog>
<dialog id="restart" aria-labelledby="restart-title">
  <form method="dialog">
    <h2 id="restart-title" data-t="New game"></h2>
    <p id="restart-message" data-t="restartLoss"></p>
    <div class="dialog-actions">
      <button value="cancel" data-t="Close" autofocus></button>
      <button value="start" class="primary" data-t="New game"></button>
    </div>
  </form>
</dialog>
